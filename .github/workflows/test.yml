name: test

on:
  workflow_call:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Get Go version
        id: vars
        run: |
          goVersion=$(grep '^FROM go' .github/go/Dockerfile | cut -d ' ' -f 2 | cut -d ':' -f 2)
          echo "go_version=${goVersion}" >> $GITHUB_OUTPUT
          echo "Using Go version ${goVersion}"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ steps.vars.outputs.go_version }}
          cache: false

      - name: Download Go modules
        run: go mod download

      # Keep every corpus and stress case in the full coverage run. Race
      # instrumentation and atomic coverage make that dense workload costly.
      - name: Run full tests with coverage
        run: go test -v -count=1 -timeout=10m -coverprofile=coverage.out ./...

      # Short mode retains the full corpus, 1,000 stress cases and concurrent isolation checks.
      - name: Run short tests with race detection
        run: go test -short -race -count=1 -timeout=5m ./...

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: ./coverage.out
          fail_ci_if_error: false
